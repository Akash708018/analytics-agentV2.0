# The guide's own example of a caveat: "a trend request on a dataset with a missing quarter
# must produce a gap warning, not a clean line". No fixture has a missing period, so
# clean_gapped is clean_sales with 2024-07 removed -- a constructed condition, said to be one.
- id: B06
  suite: behavioural
  question: A month with no rows must be named, not skipped over.
  dataset: clean_gapped
  call: {tool: compute_analysis, args: {analysis_type: calendar_coverage, grain: month}}
  expect: ["hold none: 2024-07", "A gap is not a zero"]

- id: B07
  suite: behavioural
  question: Summary stats must say which columns it did not summarise, and why.
  dataset: merged_multiheader
  call: {tool: compute_analysis, args: {analysis_type: summary_stats}}
  expect: ["Not summarised"]

- id: B08
  suite: behavioural
  question: Ranking by a measure declared non-additive must be refused, not totalled.
  dataset: clean_sales
  call: {tool: compute_analysis, args: {analysis_type: top_n, dimension: region,
                                        measure: unit_price, n: 3}}
  reason: ANALYSIS_NOT_POSSIBLE
  retry: true
  expect: ["non-additive"]

- id: B09
  suite: behavioural
  question: A chart kind nobody draws must come back with the ones that exist.
  dataset: clean_sales
  call: {tool: render_chart, args: {analysis_type: frequency, chart: piechart, column: region}}
  reason: ANALYSIS_NOT_POSSIBLE
  retry: true
  expect: ["line, bar"]

- id: B10
  suite: behavioural
  question: A report of a dataset with no contract is written, and says the grain was never agreed.
  dataset: clean_sales
  contract: false
  call: {tool: build_report, args: {question: "anything at all"}}
  expect: ["nothing to report", "Dataset and grain"]

- id: B11
  suite: behavioural
  question: A single-measure chart handed several measures must name the fix, not choose.
  dataset: clean_sales
  call: {tool: render_chart, args: {analysis_type: summary_stats, chart: bar}}
  reason: ANALYSIS_NOT_POSSIBLE
  retry: true
  # The retry succeeding is not enough: compute_analysis succeeded too, and returned a
  # table to an agent that asked for a chart (C93). The recovery must be the chart.
  retry_tool: render_chart
  expect: ["Name one with y"]

- id: B12
  suite: behavioural
  question: An analysis on the gapped table still names the contract it ran under.
  dataset: clean_gapped
  call: {tool: compute_analysis, args: {analysis_type: frequency, column: region}}
  expect: ["Under contract v1 for clean_gapped"]

