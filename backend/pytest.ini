# The v1 engine suite. v1 tests use paths relative to the project root (tests/fixtures,
# engine/server.py, docs/contracts), and v1's project root is backend/ -- so run from here:
#   cd backend && uv run pytest -q
# Several v1 tests SKIP rather than fail when run from elsewhere; count skips.
[pytest]
testpaths = tests
pythonpath = ..
