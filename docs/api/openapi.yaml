components:
  schemas:
    ApprovalResult:
      properties:
        applied:
          items:
            type: string
          type: array
          title: Applied
        rejected:
          items:
            type: string
          type: array
          title: Rejected
        ledger_entries:
          type: integer
          title: Ledger Entries
      type: object
      required:
      - applied
      - rejected
      - ledger_entries
      title: ApprovalResult
      examples:
      - applied:
        - a1
        ledger_entries: 1
        rejected: []
    ApproveActions:
      properties:
        approve:
          items:
            type: string
          type: array
          title: Approve
          description: ids to apply
        reject:
          items:
            type: string
          type: array
          title: Reject
          default: []
      type: object
      required:
      - approve
      title: ApproveActions
      examples:
      - approve:
        - a1
        reject: []
    Body_upload_workspaces__ws__uploads_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_workspaces__ws__uploads_post
    ChartSeries:
      properties:
        chart:
          type: string
          enum:
          - line
          - bar
          - stacked_bar
          - scatter
          - table
          - funnel
          title: Chart
        name:
          type: string
          title: Name
        x_label:
          type: string
          title: X Label
        y_label:
          type: string
          title: Y Label
        points:
          items:
            $ref: '#/components/schemas/SeriesPoint'
          type: array
          title: Points
      type: object
      required:
      - chart
      - name
      - x_label
      - y_label
      - points
      title: ChartSeries
      description: 'Chart-ready: computed by the backend. The frontend only plots.'
      examples:
      - chart: bar
        name: ROAS by channel
        points:
        - x: google
          y: 3.8
        - x: meta
          y: 2.4
        x_label: channel
        y_label: ROAS
    CleaningProposal:
      properties:
        action_id:
          type: string
          title: Action Id
        kind:
          type: string
          title: Kind
        column:
          anyOf:
          - type: string
          - type: 'null'
          title: Column
        description:
          type: string
          title: Description
        rows_affected:
          type: integer
          title: Rows Affected
        lossy:
          type: boolean
          title: Lossy
          default: false
        suggested:
          type: boolean
          title: Suggested
          description: 'Lossless and conflict-free: may be pre-ticked for the person; never applied without
            approval'
          default: false
      type: object
      required:
      - action_id
      - kind
      - column
      - description
      - rows_affected
      title: CleaningProposal
    CleaningProposals:
      properties:
        dataset_id:
